<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Binance Wallet</title>
    <style>
      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f3f3;
        color: #111827;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .welcome-wrap {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 18px;
        padding: 40px 24px;
      }

      .welcome-text {
        margin: 0;
        font-size: clamp(28px, 3vw, 42px);
        font-weight: 400;
        color: #111827;
        line-height: 1.2;
      }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .brand-image {
        width: 86px;
        height: 86px;
        object-fit: contain;
        display: block;
      }

      .brand-name {
        font-size: clamp(32px, 5vw, 64px);
        line-height: 1;
        letter-spacing: -0.05em;
        font-weight: 600;
        color: #f0b90b;
      }

      .wallet-word {
        color: #111827;
        font-weight: 400;
      }

      @media (max-width: 640px) {
        .welcome-wrap {
          gap: 12px;
        }

        .brand-row {
          gap: 12px;
        }

        .brand-image {
          width: 60px;
          height: 60px;
        }
      }
    </style>
  </head>
  <body>
    <div class="welcome-wrap">
      <p class="welcome-text">Welcome to</p>

      <div class="brand-row">
        <img class="brand-image" src="assets/binance-4bd0f2d0.png" alt="Binance logo" />
        <div class="brand-name">
          <span>BINANCE</span>
          <span class="wallet-word">Wallet</span>
        </div>
      </div>
    </div>

    <script>
      setTimeout(function () {
        window.location.href = '../wallet.html?fromWelcome=1';
      }, 2000);
    </script>
  </body>
</html>
