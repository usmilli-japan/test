<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binance Loader</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #181a20; /* Binance dark background */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .binance-loader {
      width: 40px;
      height: 40px;
      aspect-ratio: 1 / 1;
      flex: 0 0 40px;
      overflow: hidden;
    }

    .binance-loader svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Target the individual SVG components of the Binance logo */
    .binance-part {
      fill: #f0b90b; /* Binance yellow */
      transform-origin: center;
      /* Speed set to 0.5s cycle duration */
      animation: pulse 0.5s infinite ease-in-out;
    }

    /* Delays scaled to match 0.5s total speed */
    .top-chevron    { animation-delay: 0.0s; }
    .left-diamond   { animation-delay: 0.07s; }
    .center-diamond { animation-delay: 0.14s; }
    .right-diamond  { animation-delay: 0.07s; }
    .bottom-chevron { animation-delay: 0.21s; }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.25;
        transform: scale(0.92);
      }
      50% {
        opacity: 1;
        transform: scale(1.08);
      }
    }
  </style>
</head>
<body>

  <div class="binance-loader">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
      
      <!-- Top Chevron -->
      <path class="binance-part top-chevron" d="M60,10 L84.7,34.7 L72.3,47.1 L60,34.7 L47.7,47.1 L35.3,34.7 Z" />
      
      <!-- Left Diamond -->
      <polygon class="binance-part left-diamond" points="17.7,60 30.1,47.6 42.5,60 30.1,72.4" />
      
      <!-- Center Diamond -->
      <polygon class="binance-part center-diamond" points="60,47.6 72.4,60 60,72.4 47.6,60" />
      
      <!-- Right Diamond -->
      <polygon class="binance-part right-diamond" points="102.3,60 89.9,47.6 77.5,60 89.9,72.4" />
      
      <!-- Bottom Chevron -->
      <path class="binance-part bottom-chevron" d="M60,110 L35.3,85.3 L47.7,72.9 L60,85.3 L72.3,72.9 L84.7,85.3 Z" />

    </svg>
  </div>

</body>
</html>
